<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Absensi Sekolah V3</title><link rel="stylesheet" href="/style.css">
<script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
</head>
<body>
<div id="loginPage">
  <div class="login-reference" aria-label="Masuk ke Sistem">
    <button class="login-hotspot admin" onclick="selectLogin('admin')" aria-label="Login Admin"></button>
    <button class="login-hotspot piket" onclick="selectLogin('piket')" aria-label="Login Guru Piket"></button>
    <button class="login-hotspot guru" onclick="selectLogin('guru')" aria-label="Login Guru"></button>
  </div>
  <div id="loginFormPanel" class="login-form-panel hidden">
    <div class="login-form-card">
      <button class="login-close" onclick="closeLoginForm()">×</button>
      <div class="login-form-icon">🔐</div>
      <div class="login-form-title" id="loginRoleTitle">Login Admin</div>
      <div class="login-form-school" id="loginSchoolName">SD NEGERI KIUPUNU</div>
      <input id="username" placeholder="Username" autocomplete="username">
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
      <button class="login-submit" onclick="doLogin()">Masuk ke Sistem</button>
      <small>Masukkan akun yang telah terdaftar.</small>
    </div>
  </div>
</div>

<div id="app" class="hidden">
  <aside>
    <div class="brand"><div class="brand-avatar">👨🏻‍💼</div><div><b>Admin</b><small>Administrator</small></div><span>›</span></div>
    <nav id="nav"></nav>
    <div class="sidebottom"><button onclick="logout()">↪ <span>Logout</span></button></div>
  </aside>
  <main>
    <header><div><h2 id="title">Dashboard Admin</h2><small id="welcome">Selamat datang, Admin</small></div><div class="header-right"><div class="header-date" id="headerDate"></div><div class="bell">♧<i></i></div></div></header>
    <section id="content"></section>
  </main>
</div>

<div id="modal" class="modal hidden"><div class="modalcard"><button class="close" onclick="closeModal()">×</button><h2 id="modalTitle">📷 Kamera</h2><p id="modalHelp"></p><div class="camera"><video id="video" autoplay muted playsinline></video><div class="guide"></div></div><div id="camStatus" class="notice">Memuat...</div><button id="camAction" class="primary" onclick="cameraAction()">Mulai</button></div></div>
<script src="/app.js"></script>
</body></html>
